# Publica no npm por Trusted Publishing (OIDC do GitHub Actions), sem token:
# o pacote no npmjs.com confia neste repo, neste workflow e no ambiente "npm".
# Dispara apenas manualmente (workflow_dispatch); o ambiente "npm" exige a
# aprovacao da dona do projeto antes do publish.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # Trusted Publishing pede npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
