# ATENCAO: este workflow NUNCA foi executado por ninguem. Ele publica o pacote
# no npm, entao so a dona do projeto deve rodar, depois de: (1) ter a conta no
# npm com 2FA ativo, (2) criar o segredo NPM_TOKEN no repositorio, (3) criar o
# ambiente "npm" em Settings > Environments com aprovacao obrigatoria.
# Dispara apenas manualmente (workflow_dispatch); nunca em push ou tag.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
